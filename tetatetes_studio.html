<!doctype html>
<html lang="fr"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>tetatetes · studio</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:#0e0e0f;color:#ececec;
 font:14px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
 -webkit-user-select:none;user-select:none;overscroll-behavior:none;touch-action:none}
#app{display:flex;flex-direction:column;height:100%}
header{display:flex;align-items:center;gap:8px;padding:9px 12px;background:#141416;
 border-bottom:1px solid #232326;flex:0 0 auto;padding-top:calc(9px + env(safe-area-inset-top))}
header b{font-size:18px;letter-spacing:-.4px}
.tag{color:#cf291a;font:600 10px/1 ui-monospace,Menlo,monospace;letter-spacing:2px}
.sp{flex:1}
.btn{padding:0 13px;height:40px;background:#212124;border:1px solid #2f2f33;color:#e8e8e8;border-radius:9px;
 font-size:13px;cursor:pointer;white-space:nowrap;display:inline-flex;align-items:center;justify-content:center;gap:6px}
.btn:active{background:#333338}
.btn.pri{background:#cf291a;border-color:#cf291a;color:#fff;font-weight:600}
.btn.gh{background:transparent;border-color:transparent;font-size:17px;min-width:40px;padding:0 8px}
.btn:disabled{opacity:.3}
main{flex:1;display:flex;min-height:0;position:relative}
aside{width:290px;flex:0 0 290px;background:#141416;border-right:1px solid #232326;overflow-y:auto;
 padding:12px 12px 40px;-webkit-overflow-scrolling:touch}
aside.right{border-right:0;border-left:1px solid #232326}
details{border-bottom:1px solid #202024;padding:2px 0}
details[open]{padding-bottom:10px}
summary{list-style:none;cursor:pointer;padding:13px 2px;font:600 10px/1 ui-monospace,Menlo,monospace;
 letter-spacing:1.8px;color:#8d8d95;display:flex;align-items:center;justify-content:space-between}
summary::-webkit-details-marker{display:none}
summary:after{content:'+';font-size:15px;color:#5d5d66}
details[open] summary:after{content:'–'}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:7px}
.grid.c2{grid-template-columns:repeat(2,1fr)}
.thumb{aspect-ratio:1;background:#1d1d20;border:1px solid #2c2c30;border-radius:9px;display:flex;
 align-items:center;justify-content:center;cursor:pointer;padding:8px}
.thumb:active{border-color:#cf291a;background:#2a2a2f}
.thumb img{max-width:100%;max-height:100%;object-fit:contain;pointer-events:none}
input,select,textarea{width:100%;padding:10px;background:#1b1b1e;border:1px solid #2e2e33;color:#f0f0f0;
 border-radius:8px;font-size:16px;font-family:inherit;min-height:42px}
input[type=range]{padding:0;min-height:34px;accent-color:#cf291a}
textarea{resize:vertical;min-height:64px}
select:focus,input:focus,textarea:focus{outline:0;border-color:#cf291a}
label.f{display:block;font:600 10px/1 ui-monospace,Menlo,monospace;letter-spacing:1.4px;color:#8d8d95;margin:12px 0 5px}
.row{display:flex;gap:7px}.row>*{flex:1}
.sw{display:flex;gap:8px;flex-wrap:wrap}
.sw i{width:34px;height:34px;border-radius:50%;border:2px solid #3a3a40;cursor:pointer;display:block}
.sw i.on{border-color:#cf291a;box-shadow:0 0 0 2px rgba(207,41,26,.3)}
#stage{flex:1;min-width:0;position:relative;background:#3a3a40;overflow:hidden;touch-action:none}
#cv{position:absolute;inset:0;width:100%;height:100%;touch-action:none;display:block}
#fab{position:absolute;display:none;gap:6px;background:#cf291a;border-radius:11px;padding:6px;
 box-shadow:0 6px 22px rgba(0,0,0,.55);z-index:12;transform:translate(-50%,-100%)}
#fab button{width:42px;height:42px;border:0;border-radius:8px;background:transparent;color:#fff;
 font-size:18px;cursor:pointer;display:flex;align-items:center;justify-content:center}
#fab button:active{background:rgba(255,255,255,.22)}
#zoombar{position:absolute;right:12px;bottom:12px;display:flex;gap:6px;align-items:center;z-index:11;
 background:rgba(18,18,20,.92);border:1px solid #303036;border-radius:11px;padding:5px}
#zoombar button{width:38px;height:38px;border:0;background:transparent;color:#ddd;font-size:17px;border-radius:8px;cursor:pointer}
#zoombar button:active{background:#2e2e34}
#zval{font:600 11px/1 ui-monospace,monospace;color:#9a9aa2;min-width:46px;text-align:center}
#bottom{display:none;gap:6px;padding:8px 10px calc(8px + env(safe-area-inset-bottom));
 background:#141416;border-top:1px solid #232326;flex:0 0 auto}
#bottom .btn{flex:1;flex-direction:column;height:52px;font-size:10px;gap:2px;padding:0}
#bottom .btn em{font-style:normal;font-size:18px;line-height:1}
.layer{display:flex;align-items:center;gap:8px;padding:10px 8px;border-radius:8px;cursor:pointer;border:1px solid transparent}
.layer.on{background:#212124;border-color:#3d3d44}
.layer span{flex:1;font-size:12px;color:#c9c9cf;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.layer button{background:none;border:0;color:#7a7a82;font-size:16px;cursor:pointer;padding:6px 8px}
.hint{color:#6b6b73;font-size:11px;line-height:1.5;margin:9px 0 0}
@media(max-width:920px){
 aside{position:absolute;top:0;bottom:0;left:0;z-index:20;width:min(88vw,320px);flex:none;
  transform:translateX(-101%);transition:transform .2s ease;box-shadow:0 0 40px rgba(0,0,0,.7)}
 aside.right{left:auto;right:0;transform:translateX(101%)}
 aside.open{transform:none}
 #bottom{display:flex}
 .tag,#deskbtns{display:none}
 #zoombar{bottom:12px;right:10px}
}
</style></head><body><div id="app">
<header>
 <b>tetatetes</b><span class="tag">STUDIO</span>
 <span class="sp"></span>
 <span id="deskbtns" style="display:flex;gap:8px">
  <button class="btn gh" id="undo" title="annuler">↶</button>
  <button class="btn gh" id="redo" title="rétablir">↷</button>
  <button class="btn" id="save">projet</button>
 </span>
 <button class="btn pri" id="dl">télécharger</button>
</header>
<main>
<aside id="left">
 <details open><summary>FORMAT</summary>
  <select id="fmt">
   <option value="1080x1080">post carré · 1080</option>
   <option value="1080x1350">post portrait · 1080×1350</option>
   <option value="1080x1920">story · 1080×1920</option>
   <option value="1920x1080">bannière · 1920×1080</option>
   <option value="2480x3508">affiche A4 · 300dpi</option>
   <option value="custom">personnalisé…</option>
  </select>
  <div class="row" id="customwh" style="display:none;margin-top:8px">
   <input id="cw" type="number" value="1080"><input id="chh" type="number" value="1080">
  </div>
 </details>
 <details open><summary>FOND</summary>
  <div class="sw" id="bgsw"></div>
  <button class="btn" style="width:100%;margin-top:10px" id="imp">importer une image</button>
  <input type="file" id="file" accept="image/*" style="display:none">
  <p class="hint">l'image devient un calque : déplace-la, redimensionne-la, puis « au fond ».</p>
 </details>
 <details open><summary>OBJETS</summary><div class="grid" id="items"></div></details>
 <details><summary>LOGO &amp; NOM</summary><div class="grid c2" id="brand"></div></details>
 <details open><summary>TEXTE</summary>
  <button class="btn" style="width:100%" id="addtxt">+ zone de texte</button>
  <p class="hint">ton écriture : minuscules, chiffres, - &amp; + €</p>
 </details>
</aside>
<div id="stage">
 <canvas id="cv"></canvas>
 <div id="fab">
  <button id="f_dup" title="dupliquer">⧉</button>
  <button id="f_flip" title="miroir">⇄</button>
  <button id="f_front" title="devant">▲</button>
  <button id="f_back" title="derrière">▼</button>
  <button id="f_del" title="supprimer">✕</button>
 </div>
 <div id="zoombar">
  <button id="zout">−</button><span id="zval">100%</span>
  <button id="zin">+</button><button id="zfit" title="ajuster">⤢</button>
 </div>
</div>
<aside class="right" id="right">
 <details open><summary>SÉLECTION</summary><div id="props"><p class="hint">touche un élément du visuel.</p></div></details>
 <details open><summary>CALQUES</summary><div id="layers"></div></details>
</aside>
</main>
<div id="bottom">
 <button class="btn" id="b_items"><em>◼</em>objets</button>
 <button class="btn" id="b_text"><em>T</em>texte</button>
 <button class="btn" id="b_undo"><em>↶</em>annuler</button>
 <button class="btn" id="b_redo"><em>↷</em>rétablir</button>
 <button class="btn" id="b_props"><em>⚙</em>réglages</button>
</div>
</div>

const $=id=>document.getElementById(id);
const cv=$('cv'), ctx=cv.getContext('2d'), stage=$('stage');
const GL={},IT={},EX={}; let ready=false;
const ld=src=>new Promise(r=>{const i=new Image();i.onload=()=>r(i);i.onerror=()=>r(null);i.src=src;});
(async()=>{
 for(const k in A.glyphs){const im=await ld(A.glyphs[k].src);GL[k]={img:im,above:A.glyphs[k].above,below:A.glyphs[k].below};}
 for(const k in A.items) IT[k]=await ld(A.items[k]);
 for(const k in A.extra) EX[k]=await ld(A.extra[k]);
 ready=true;buildPalettes();newDoc(1080,1080);
})();
/* teinture cachée */
const tc={};
function tint(img,color){
 const key=(img.__id||(img.__id=Math.random()))+'|'+color;
 if(tc[key])return tc[key];
 const c=document.createElement('canvas');c.width=img.width;c.height=img.height;
 const x=c.getContext('2d');x.drawImage(img,0,0);
 x.globalCompositeOperation='source-in';x.fillStyle=color;x.fillRect(0,0,c.width,c.height);
 return tc[key]=c;
}
/* document + vue */
let doc={w:1080,h:1080,bg:'#000000',layers:[]};
let sel=null,hist=[],future=[],guides=[];
let vs=1,vx=0,vy=0;                     /* zoom + pan */
const uid=()=>Math.random().toString(36).slice(2,9);
function snapshot(){hist.push(serialize());if(hist.length>70)hist.shift();future=[];syncUndo();}
function serialize(){return JSON.stringify({w:doc.w,h:doc.h,bg:doc.bg,
 layers:doc.layers.map(l=>{const o={...l};delete o.__img;return o;})});}
async function deser(s){const d=JSON.parse(s);
 for(const l of d.layers){if(l.t==='img'&&l.src)l.__img=await ld(l.src);}return d;}
function syncUndo(){[['undo','b_undo',hist],['redo','b_redo',future]].forEach(([a,b,arr])=>{
 [$(a),$(b)].forEach(e=>{if(e)e.disabled=!arr.length;});});}
async function undo(){if(!hist.length)return;future.push(serialize());doc=await deser(hist.pop());sel=null;syncUndo();refresh();}
async function redo(){if(!future.length)return;hist.push(serialize());doc=await deser(future.pop());sel=null;syncUndo();refresh();}
function newDoc(w,h){doc={w,h,bg:'#000000',layers:[]};hist=[];future=[];sel=null;fitView();refresh();}
/* texte manuscrit */
function normTxt(s){return (s||'').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'');}
function textMetrics(t,xh,tr){
 const u=xh/32,sp=xh*.5,gap=xh*tr;let w=0,above=xh,below=0;
 for(const ch of t){
  if(ch===' '){w+=sp+gap;continue;}
  const g=GL[ch];if(!g)continue;
  const h=(g.above+g.below)*u;
  w+=h*g.img.width/g.img.height+gap;
  above=Math.max(above,g.above*u);below=Math.max(below,g.below*u);}
 return{w:Math.max(1,w-gap),above,below,h:Math.max(1,above+below)};
}
function textCanvas(l){
 const t=normTxt(l.txt),m=textMetrics(t,l.xh,l.tr);
 const c=document.createElement('canvas');
 c.width=Math.ceil(m.w);c.height=Math.ceil(m.h);
 const x=c.getContext('2d'),u=l.xh/32,sp=l.xh*.5,gap=l.xh*l.tr;let px=0;
 for(const ch of t){
  if(ch===' '){px+=sp+gap;continue;}
  const g=GL[ch];if(!g)continue;
  const h=(g.above+g.below)*u,w=h*g.img.width/g.img.height;
  x.drawImage(tint(g.img,l.c),px,m.above-g.above*u,w,h);px+=w+gap;}
 return c;
}
function srcOf(l){return l.t==='item'?IT[l.k]:l.t==='brand'?EX[l.k]:l.t==='img'?l.__img:null;}
function natural(l){
 if(l.t==='text'){const m=textMetrics(normTxt(l.txt),l.xh,l.tr);return{w:m.w,h:m.h};}
 const i=srcOf(l);return i?{w:i.width,h:i.height}:{w:100,h:100};}
function box(l){const n=natural(l);return{w:n.w*l.s,h:n.h*l.s};}
/* rendu */
function drawLayers(c){
 for(const l of doc.layers){
  const b=box(l);c.save();c.globalAlpha=l.o==null?1:l.o;
  c.translate(l.x,l.y);c.rotate(l.r||0);if(l.flip)c.scale(-1,1);
  if(l.t==='text')c.drawImage(textCanvas(l),-b.w/2,-b.h/2,b.w,b.h);
  else{const i=srcOf(l);if(i)c.drawImage(l.t==='img'?i:tint(i,l.c),-b.w/2,-b.h/2,b.w,b.h);}
  c.restore();}
}
function render(){
 if(!ready)return;
 const dpr=Math.min(devicePixelRatio||1,2), W=stage.clientWidth, H=stage.clientHeight;
 cv.width=W*dpr;cv.height=H*dpr;
 ctx.setTransform(dpr,0,0,dpr,0,0);
 ctx.fillStyle='#3a3a40';ctx.fillRect(0,0,W,H);          /* hors format */
 ctx.save();ctx.translate(vx,vy);ctx.scale(vs,vs);
 ctx.save();ctx.shadowColor='rgba(0,0,0,.55)';ctx.shadowBlur=26/vs;ctx.shadowOffsetY=8/vs;
 ctx.fillStyle=doc.bg;ctx.fillRect(0,0,doc.w,doc.h);ctx.restore();
 ctx.save();ctx.beginPath();ctx.rect(0,0,doc.w,doc.h);ctx.clip();drawLayers(ctx);ctx.restore();
 ctx.strokeStyle='rgba(255,255,255,.55)';ctx.lineWidth=1.5/vs;ctx.strokeRect(0,0,doc.w,doc.h);
 if(sel){
  const b=box(sel),hs=8/vs;
  ctx.save();ctx.translate(sel.x,sel.y);ctx.rotate(sel.r||0);
  ctx.strokeStyle='#cf291a';ctx.lineWidth=2/vs;ctx.setLineDash([8/vs,5/vs]);
  ctx.strokeRect(-b.w/2,-b.h/2,b.w,b.h);ctx.setLineDash([]);
  ctx.fillStyle='#cf291a';ctx.strokeStyle='#fff';ctx.lineWidth=1.5/vs;
  [[-1,-1],[1,-1],[1,1],[-1,1]].forEach(([sx,sy])=>{
   ctx.beginPath();ctx.rect(sx*b.w/2-hs,sy*b.h/2-hs,hs*2,hs*2);ctx.fill();ctx.stroke();});
  ctx.beginPath();ctx.moveTo(0,-b.h/2);ctx.lineTo(0,-b.h/2-30/vs);ctx.strokeStyle='#cf291a';ctx.lineWidth=2/vs;ctx.stroke();
  ctx.beginPath();ctx.arc(0,-b.h/2-30/vs,hs*1.15,0,7);ctx.fillStyle='#cf291a';ctx.fill();
  ctx.strokeStyle='#fff';ctx.lineWidth=1.5/vs;ctx.stroke();
  ctx.restore();
 }
 if(guides.length){ctx.save();ctx.strokeStyle='#00e0c0';ctx.lineWidth=1.2/vs;
  guides.forEach(g=>{ctx.beginPath();
   if(g.v){ctx.moveTo(g.p,-40/vs);ctx.lineTo(g.p,doc.h+40/vs);}
   else{ctx.moveTo(-40/vs,g.p);ctx.lineTo(doc.w+40/vs,g.p);}ctx.stroke();});ctx.restore();}
 ctx.restore();
 $('zval').textContent=Math.round(vs*100)+'%';
 placeFab();
}
function fitView(){
 const pad=44,W=stage.clientWidth,H=stage.clientHeight;
 vs=Math.min((W-pad)/doc.w,(H-pad)/doc.h);
 vx=(W-doc.w*vs)/2;vy=(H-doc.h*vs)/2;
}
function zoomAt(f,cx,cy){
 const ns=Math.max(.04,Math.min(8,vs*f));
 vx=cx-(cx-vx)*(ns/vs);vy=cy-(cy-vy)*(ns/vs);vs=ns;render();
}
function refresh(){render();layerList();propPanel();}
addEventListener('resize',()=>{render();});
/* ---------- coordonnées ---------- */
function toDoc(e){const r=cv.getBoundingClientRect();
 return{x:(e.clientX-r.left-vx)/vs,y:(e.clientY-r.top-vy)/vs};}
function local(l,p){const dx=p.x-l.x,dy=p.y-l.y,a=-(l.r||0);
 return{x:dx*Math.cos(a)-dy*Math.sin(a),y:dx*Math.sin(a)+dy*Math.cos(a)};}
function handleAt(p){
 if(!sel)return null;
 const b=box(sel),q=local(sel,p),t=16/vs;
 if(Math.abs(q.x)<t&&Math.abs(q.y+b.h/2+30/vs)<t)return 'rot';
 for(const [sx,sy] of [[-1,-1],[1,-1],[1,1],[-1,1]])
  if(Math.abs(q.x-sx*b.w/2)<t&&Math.abs(q.y-sy*b.h/2)<t)return 'sc';
 return null;
}
function pick(p){
 for(let i=doc.layers.length-1;i>=0;i--){
  const l=doc.layers[i],b=box(l),q=local(l,p);
  if(Math.abs(q.x)<=b.w/2&&Math.abs(q.y)<=b.h/2)return l;}
 return null;
}
/* ---------- barre flottante ---------- */
function placeFab(){
 const f=$('fab');
 if(!sel||drag){f.style.display='none';return;}
 const b=box(sel),pts=[[-1,-1],[1,-1],[1,1],[-1,1]].map(([sx,sy])=>{
  const a=sel.r||0,x=sx*b.w/2,y=sy*b.h/2;
  return{x:sel.x+x*Math.cos(a)-y*Math.sin(a),y:sel.y+x*Math.sin(a)+y*Math.cos(a)};});
 const sxs=pts.map(p=>p.x*vs+vx),sys=pts.map(p=>p.y*vs+vy);
 const cx=(Math.min(...sxs)+Math.max(...sxs))/2, top=Math.min(...sys);
 f.style.display='flex';
 f.style.left=Math.max(120,Math.min(stage.clientWidth-120,cx))+'px';
 f.style.top=Math.max(64,top-18)+'px';
}
/* ---------- gestes ---------- */
let drag=null; const pts=new Map(); let pinch=null;
cv.addEventListener('pointerdown',e=>{
 cv.setPointerCapture(e.pointerId); pts.set(e.pointerId,e);
 if(pts.size===2){
  drag=null;
  const [a,b]=[...pts.values()];
  pinch={d:Math.hypot(a.clientX-b.clientX,a.clientY-b.clientY),
         mx:(a.clientX+b.clientX)/2,my:(a.clientY+b.clientY)/2};
  placeFab();return;
 }
 const p=toDoc(e),h=handleAt(p);
 if(h&&sel){
  const b=box(sel);snapshot();
  drag={mode:h,l:sel,s0:sel.s,xh0:sel.xh,r0:sel.r||0,
        a0:Math.atan2(p.y-sel.y,p.x-sel.x),d0:Math.max(1,Math.hypot(b.w,b.h)/2)};
  placeFab();return;
 }
 const l=pick(p);
 if(l!==sel){sel=l;propPanel();layerList();}
 if(l){snapshot();drag={mode:'move',l,p0:p,x0:l.x,y0:l.y};}
 else drag={mode:'pan',sx:e.clientX,sy:e.clientY,vx0:vx,vy0:vy};
 render();
});
cv.addEventListener('pointermove',e=>{
 if(pts.has(e.pointerId))pts.set(e.pointerId,e);
 if(pts.size===2&&pinch){
  const [a,b]=[...pts.values()];
  const d=Math.hypot(a.clientX-b.clientX,a.clientY-b.clientY);
  const mx=(a.clientX+b.clientX)/2,my=(a.clientY+b.clientY)/2;
  const r=cv.getBoundingClientRect();
  vx+=mx-pinch.mx;vy+=my-pinch.my;
  const f=d/Math.max(1,pinch.d);
  const ns=Math.max(.04,Math.min(8,vs*f)),cx=mx-r.left,cy=my-r.top;
  vx=cx-(cx-vx)*(ns/vs);vy=cy-(cy-vy)*(ns/vs);vs=ns;
  pinch={d,mx,my};render();return;
 }
 if(!drag)return;
 if(drag.mode==='pan'){vx=drag.vx0+(e.clientX-drag.sx);vy=drag.vy0+(e.clientY-drag.sy);render();return;}
 const p=toDoc(e),l=drag.l;
 if(drag.mode==='move'){
  l.x=drag.x0+(p.x-drag.p0.x);l.y=drag.y0+(p.y-drag.p0.y);
  guides=[];const T=12/vs;
  [doc.w/2,doc.w*.25,doc.w*.75].forEach(g=>{if(Math.abs(l.x-g)<T){l.x=g;guides.push({v:1,p:g});}});
  [doc.h/2,doc.h*.25,doc.h*.75].forEach(g=>{if(Math.abs(l.y-g)<T){l.y=g;guides.push({v:0,p:g});}});
 }else if(drag.mode==='rot'){
  let a=Math.atan2(p.y-l.y,p.x-l.x)-drag.a0+drag.r0;
  if(Math.abs(a%(Math.PI/2))<.06)a=Math.round(a/(Math.PI/2))*(Math.PI/2);
  l.r=a;
 }else{
  const k=Math.max(.05,Math.hypot(p.x-l.x,p.y-l.y)/drag.d0);
  if(l.t==='text')l.xh=Math.max(6,drag.xh0*k); else l.s=Math.max(.02,drag.s0*k);
 }
 render();
});
function endPtr(e){
 pts.delete(e.pointerId);
 if(pts.size<2)pinch=null;
 if(drag){drag=null;guides=[];render();layerList();propPanel();}
}
cv.addEventListener('pointerup',endPtr);
cv.addEventListener('pointercancel',endPtr);
cv.addEventListener('wheel',e=>{
 e.preventDefault();const r=cv.getBoundingClientRect();
 zoomAt(Math.pow(.998,e.deltaY),e.clientX-r.left,e.clientY-r.top);
},{passive:false});
cv.addEventListener('dblclick',()=>{fitView();render();});
/* ---------- clavier ---------- */
addEventListener('keydown',e=>{
 const t=(e.target.tagName||'').toLowerCase();
 if(t==='input'||t==='textarea'||t==='select')return;
 const m=e.metaKey||e.ctrlKey;
 if(m&&e.key.toLowerCase()==='z'){e.preventDefault();e.shiftKey?redo():undo();return;}
 if(m&&e.key.toLowerCase()==='d'&&sel){e.preventDefault();dup();return;}
 if(!sel)return;
 if(e.key==='Delete'||e.key==='Backspace'){e.preventDefault();del();return;}
 if(e.key==='Escape'){sel=null;refresh();return;}
 const s=e.shiftKey?20:2,k=e.key;
 if(k==='ArrowLeft'){sel.x-=s;render();e.preventDefault();}
 if(k==='ArrowRight'){sel.x+=s;render();e.preventDefault();}
 if(k==='ArrowUp'){sel.y-=s;render();e.preventDefault();}
 if(k==='ArrowDown'){sel.y+=s;render();e.preventDefault();}
});
/* ---------- actions ---------- */
function del(){if(!sel)return;snapshot();doc.layers=doc.layers.filter(l=>l!==sel);sel=null;refresh();}
function dup(){if(!sel)return;snapshot();const c={...sel};c.id=uid();
 c.x+=doc.w*.05;c.y+=doc.h*.05;doc.layers.push(c);sel=c;refresh();}
function move(dir){if(!sel)return;snapshot();
 const i=doc.layers.indexOf(sel);doc.layers.splice(i,1);
 const j=dir==='front'?doc.layers.length:dir==='back'?0:Math.max(0,Math.min(doc.layers.length,i+dir));
 doc.layers.splice(j,0,sel);refresh();}
/* ---------- libellés / palettes ---------- */
function labelOf(l){return l.t==='text'?'“'+(l.txt||'').slice(0,15)+'”':l.t==='img'?'image':l.k;}
function pickFg(){const c=doc.bg.replace('#','');
 const L=parseInt(c.slice(0,2),16)*.299+parseInt(c.slice(2,4),16)*.587+parseInt(c.slice(4,6),16)*.114;
 return L>140?'#111111':'#ffffff';}
function add(l){snapshot();l.id=uid();doc.layers.push(l);sel=l;refresh();closePanels();}
function addItem(k,kind){
 const img=kind==='brand'?EX[k]:IT[k];
 const s=doc.w*(kind==='brand'?.42:.20)/Math.max(img.width,img.height);
 add({t:kind,k,x:doc.w/2,y:doc.h/2,s,r:0,o:1,c:pickFg()});}
function addText(){add({t:'text',txt:'tetatetes',xh:Math.round(doc.w*.10),tr:.14,
 x:doc.w/2,y:doc.h/2,s:1,r:0,o:1,c:pickFg()});}
function buildPalettes(){
 const it=$('items');
 Object.keys(IT).forEach(k=>{const d=document.createElement('div');d.className='thumb';
  const i=new Image();i.src=tint(IT[k],'#ffffff').toDataURL();d.appendChild(i);
  d.onclick=()=>addItem(k,'item');it.appendChild(d);});
 const br=$('brand');
 Object.keys(EX).forEach(k=>{const d=document.createElement('div');d.className='thumb';
  const i=new Image();i.src=tint(EX[k],'#ffffff').toDataURL();d.appendChild(i);
  d.onclick=()=>addItem(k,'brand');br.appendChild(d);});
 const bg=$('bgsw');
 ['#000000','#ffffff','#f2f1ee','#cf291a','#1c1c1e','#e8e2d4','#2b2b30'].forEach(col=>{
  const i=document.createElement('i');i.style.background=col;
  i.onclick=()=>{snapshot();doc.bg=col;[...bg.children].forEach(c=>c.classList.remove('on'));
   i.classList.add('on');render();};bg.appendChild(i);});
 bg.firstChild.classList.add('on');
 syncUndo();
}
/* ---------- propriétés ---------- */
function propPanel(){
 const p=$('props');
 if(!sel){p.innerHTML='<p class="hint">touche un élément du visuel.</p>';return;}
 const isTxt=sel.t==='text',isImg=sel.t==='img';
 let h='';
 if(isTxt){
  h+='<label class="f">TEXTE</label><textarea id="p_txt">'+(sel.txt||'').replace(/</g,'&lt;')+'</textarea>'
   +'<div id="p_warn" class="hint" style="color:#cf291a"></div>'
   +'<label class="f">TAILLE</label><input id="p_xh" type="range" min="10" max="'+Math.round(doc.w*.55)+'" value="'+Math.round(sel.xh)+'">'
   +'<label class="f">ESPACEMENT</label><input id="p_tr" type="range" min="0" max="60" value="'+Math.round(sel.tr*100)+'">';
 }else{
  h+='<label class="f">TAILLE</label><input id="p_s" type="range" min="1" max="400" value="'+Math.round(sel.s*100)+'">';
 }
 h+='<label class="f">ROTATION</label><input id="p_r" type="range" min="-180" max="180" value="'+Math.round((sel.r||0)*180/Math.PI)+'">'
  +'<label class="f">OPACITÉ</label><input id="p_o" type="range" min="5" max="100" value="'+Math.round((sel.o==null?1:sel.o)*100)+'">';
 if(!isImg)h+='<label class="f">COULEUR</label><div class="sw" id="p_c"></div>';
 h+='<label class="f">POSITION</label><div class="row">'
  +'<button class="btn" id="p_cx">centrer H</button><button class="btn" id="p_cy">centrer V</button></div>'
  +'<div class="row" style="margin-top:8px"><button class="btn" id="p_fill">plein cadre</button>'
  +'<button class="btn" id="p_bottom">au fond</button></div>';
 p.innerHTML=h;
 const on=(id,ev,fn)=>{const e=$(id);if(e)e.addEventListener(ev,fn);};
 if(isTxt){
  on('p_txt','input',e=>{sel.txt=e.target.value;
   const miss=[...normTxt(sel.txt)].filter(c=>c!==' '&&!GL[c]);
   $('p_warn').textContent=miss.length?'non dessiné : '+[...new Set(miss)].join(' '):'';
   render();placeFab();});
  on('p_xh','input',e=>{sel.xh=+e.target.value;render();});
  on('p_tr','input',e=>{sel.tr=+e.target.value/100;render();});
 }else on('p_s','input',e=>{sel.s=+e.target.value/100;render();});
 on('p_r','input',e=>{sel.r=+e.target.value*Math.PI/180;render();});
 on('p_o','input',e=>{sel.o=+e.target.value/100;render();});
 if(!isImg){const sw=$('p_c');
  ['#ffffff','#000000','#cf291a','#f2f1ee','#9b9b9b','#e8e2d4'].forEach(col=>{
   const i=document.createElement('i');i.style.background=col;
   if(sel.c===col)i.classList.add('on');
   i.onclick=()=>{snapshot();sel.c=col;render();propPanel();};sw.appendChild(i);});}
 on('p_cx','click',()=>{snapshot();sel.x=doc.w/2;render();});
 on('p_cy','click',()=>{snapshot();sel.y=doc.h/2;render();});
 on('p_bottom','click',()=>move('back'));
 on('p_fill','click',()=>{snapshot();const n=natural(sel);
  sel.s=Math.max(doc.w/n.w,doc.h/n.h);sel.x=doc.w/2;sel.y=doc.h/2;sel.r=0;render();propPanel();});
}
function layerList(){
 const b=$('layers');b.innerHTML='';
 [...doc.layers].reverse().forEach(l=>{
  const d=document.createElement('div');d.className='layer'+(l===sel?' on':'');
  d.innerHTML='<span>'+labelOf(l)+'</span>';
  const x=document.createElement('button');x.textContent='✕';
  x.onclick=e=>{e.stopPropagation();sel=l;del();};
  d.appendChild(x);d.onclick=()=>{sel=l;refresh();};b.appendChild(d);});
 if(!doc.layers.length)b.innerHTML='<p class="hint">aucun élément.</p>';
}
/* ---------- import ---------- */
function importFile(f){
 if(!f)return;const rd=new FileReader();
 rd.onload=async()=>{const img=await ld(rd.result);if(!img)return;
  snapshot();
  const s=Math.max(doc.w/img.width,doc.h/img.height);
  const l={t:'img',id:uid(),src:rd.result,x:doc.w/2,y:doc.h/2,s,r:0,o:1};
  l.__img=img;doc.layers.unshift(l);sel=l;refresh();closePanels();};
 rd.readAsDataURL(f);
}
$('imp').onclick=()=>$('file').click();
$('file').onchange=e=>{importFile(e.target.files[0]);e.target.value='';};
stage.addEventListener('dragover',e=>e.preventDefault());
stage.addEventListener('drop',e=>{e.preventDefault();
 const f=e.dataTransfer.files[0];if(f&&f.type.startsWith('image/'))importFile(f);});
/* ---------- format ---------- */
function resizeDoc(w,h){const kx=w/doc.w,ky=h/doc.h,k=Math.min(kx,ky);
 doc.layers.forEach(l=>{l.x*=kx;l.y*=ky;l.s*=k;if(l.t==='text')l.xh*=k;});
 doc.w=w;doc.h=h;fitView();refresh();}
$('fmt').onchange=e=>{const v=e.target.value;
 $('customwh').style.display=v==='custom'?'flex':'none';
 if(v==='custom')return;
 snapshot();const [w,h]=v.split('x').map(Number);resizeDoc(w,h);};
['cw','chh'].forEach(id=>$(id).addEventListener('change',()=>{
 snapshot();resizeDoc(Math.max(50,Math.min(6000,+$('cw').value)),Math.max(50,Math.min(6000,+$('chh').value)));}));
/* ---------- panneaux ---------- */
function closePanels(){$('left').classList.remove('open');$('right').classList.remove('open');}
$('b_items').onclick=()=>{$('right').classList.remove('open');$('left').classList.toggle('open');};
$('b_props').onclick=()=>{$('left').classList.remove('open');$('right').classList.toggle('open');};
$('b_text').onclick=addText;
$('b_undo').onclick=undo;$('b_redo').onclick=redo;
$('undo').onclick=undo;$('redo').onclick=redo;
$('addtxt').onclick=addText;
$('zin').onclick=()=>zoomAt(1.25,stage.clientWidth/2,stage.clientHeight/2);
$('zout').onclick=()=>zoomAt(.8,stage.clientWidth/2,stage.clientHeight/2);
$('zfit').onclick=()=>{fitView();render();};
['f_dup','f_flip','f_front','f_back','f_del'].forEach(id=>$(id).onclick=()=>{
 if(!sel)return;
 if(id==='f_dup')dup();
 else if(id==='f_flip'){snapshot();sel.flip=!sel.flip;render();}
 else if(id==='f_front')move('front');
 else if(id==='f_back')move('back');
 else del();});
/* ---------- export / projet ---------- */
$('dl').onclick=()=>{
 const c=document.createElement('canvas');c.width=doc.w;c.height=doc.h;
 const x=c.getContext('2d');x.fillStyle=doc.bg;x.fillRect(0,0,doc.w,doc.h);
 x.save();x.beginPath();x.rect(0,0,doc.w,doc.h);x.clip();drawLayers(x);x.restore();
 const a=document.createElement('a');
 a.download='tetatetes_'+doc.w+'x'+doc.h+'.png';
 a.href=c.toDataURL('image/png');a.click();
};
$('save').onclick=()=>{
 if(confirm('OK = enregistrer le projet\nAnnuler = ouvrir un projet')){
  const a=document.createElement('a');a.download='tetatetes_projet.json';
  a.href=URL.createObjectURL(new Blob([serialize()],{type:'application/json'}));a.click();
 }else{
  const i=document.createElement('input');i.type='file';i.accept='.json';
  i.onchange=e=>{const f=e.target.files[0];if(!f)return;
   const rd=new FileReader();
   rd.onload=async()=>{try{snapshot();doc=await deser(rd.result);sel=null;fitView();refresh();}
    catch(err){alert('fichier illisible');}};
   rd.readAsText(f);};i.click();}
};

</script></body></html>
